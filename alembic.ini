# Configuración de Alembic para Eventos Nova (PostgreSQL 18).
# La URL de conexión NO se escribe aquí: migraciones/env.py la toma de la variable de entorno DATABASE_URL (.env).
[alembic]
script_location = %(here)s/migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
