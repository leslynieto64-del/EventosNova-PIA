<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="30.0" y="40.0" font-family="Arial" font-size="20" text-anchor="start" fill="#1F4E79" font-weight="bold">SP-10 · Llegada de T: inicio automático y finalización del evento</text>
<text x="30.0" y="62.0" font-family="Arial" font-size="12" text-anchor="start" fill="#444">C-01, C-02, D-3, S-7 (ADR-008, ADR-009) · US-030, US-033 · BN-006, BN-010</text>
