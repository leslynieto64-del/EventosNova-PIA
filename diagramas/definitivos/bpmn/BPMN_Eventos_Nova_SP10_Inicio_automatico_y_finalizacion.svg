<text font-family="Arial" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" transform="translate(52.0,211.0) rotate(-90)">Sistema (trabajador)</text>
<rect x="30.0" y="326.0" width="1900.0" height="230.0" rx="4" fill="#F3EEF8" stroke="#A68BC4" stroke-width="1.5"/>
<rect x="30.0" y="326.0" width="34" height="230.0" fill="#A68BC4" stroke="#A68BC4" stroke-width="1.5"/>
<text font-family="Arial" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" transform="translate(52.0,441.0) rotate(-90)">Coordinador</text>
