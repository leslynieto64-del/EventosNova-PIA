<text x="175.0" y="220.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">Ciclo cada 2 s</text>
<rect x="275.0" y="160.0" width="150.0" height="62.0" rx="10" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="350.0" y="182.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">Buscar eventos cuya</text>
<text x="350.0" y="194.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">fecha y hora de inicio</text>
<text x="350.0" y="207.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">(T) ya llegó</text>
<path d="M525.0,166.0 L549.0,190.0 L525.0,214.0 L501.0,190.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
<text x="525.0" y="197.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#7a5c00">×</text>
<text x="525.0" y="160.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Estado del evento en T</text>
<rect x="625.0" y="120.0" width="150.0" height="62.0" rx="10" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="700.0" y="142.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">Iniciar el evento: «En</text>
<text x="700.0" y="154.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">ejecución»</text>
<text x="700.0" y="167.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">(EventoIniciado)</text>
<rect x="800.0" y="120.0" width="150.0" height="70.0" rx="10" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="875.0" y="133.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">Cerrar solicitudes de</text>
<text x="875.0" y="146.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">cambio, adicionales y</text>
<text x="875.0" y="158.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">sustituciones abiertas:</text>
<text x="875.0" y="171.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">causa «Inicio del</text>
<text x="875.0" y="183.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">evento»</text>
<rect x="625.0" y="220.0" width="150.0" height="70.0" rx="10" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="700.0" y="233.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">Cerrar sin contratación:</text>
<text x="700.0" y="246.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">Evento «Cerrado sin</text>
<text x="700.0" y="258.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">contratación»; contrato</text>
<text x="700.0" y="271.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">no confirmado «Cerrado</text>
<text x="700.0" y="283.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">sin confirmar»</text>
<ellipse cx="875.0" cy="250.0" rx="18.0" ry="18.0" fill="#F8CECC" stroke="#B85450" stroke-width="3.5"/>
<text x="875.0" y="280.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">Proceso de</text>
<text x="875.0" y="292.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">contratación</text>
<text x="875.0" y="305.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">cerrado</text>
<rect x="625.0" y="390.0" width="150.0" height="74.0" rx="10" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
<text x="700.0" y="405.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">Inicio manual de</text>
<text x="700.0" y="418.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">respaldo (solo si el</text>
<text x="700.0" y="430.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">automático no actualizó</text>
<text x="700.0" y="443.1" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">el estado y nunca antes</text>
<text x="700.0" y="455.6" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">de T)</text>
<rect x="1150.0" y="390.0" width="150.0" height="62.0" rx="10" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="1225.0" y="418.4" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">Ejecutar el evento con</text>
<text x="1225.0" y="430.9" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">los proveedores</text>
<path d="M1400.0,396.0 L1424.0,420.0 L1400.0,444.0 L1376.0,420.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
<text x="1400.0" y="427.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#7a5c00">×</text>
<text x="1400.0" y="378.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">¿El evento se realizó y</text>
<text x="1400.0" y="390.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">concluyó?</text>
<rect x="1500.0" y="390.0" width="150.0" height="62.0" rx="10" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="1575.0" y="418.4" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">Registrar finalización</text>
<text x="1575.0" y="430.9" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b1b1b">con fecha: «Finalizado»</text>
<ellipse cx="1750.0" cy="420.0" rx="18.0" ry="18.0" fill="#F8CECC" stroke="#B85450" stroke-width="3.5"/>
<text x="1750.0" y="450.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">Evento finalizado</text>
<path d="M1345.0,186.0 h348.0 l12,12 v58.0 h-360.0 z" fill="#FFFBE6" stroke="#B59F3B" stroke-width="1.2"/>
<text x="1353.0" y="212.1" font-family="Arial" font-size="10" text-anchor="start" fill="#1b1b1b">Los pagos pendientes al inicio se conservan (H-09). Un evento</text>
<text x="1353.0" y="224.6" font-family="Arial" font-size="10" text-anchor="start" fill="#1b1b1b">Cancelado nunca pasa a Finalizado; solo se finaliza un evento</text>
<text x="1353.0" y="237.1" font-family="Arial" font-size="10" text-anchor="start" fill="#1b1b1b">«En ejecución» (CA-094, CA-095).</text>
