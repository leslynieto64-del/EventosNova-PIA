      - servicio_contratado_id
      - contrato_id
      title: SustitucionEntrada
      type: object
    UsuarioEntrada:
      additionalProperties: false
      properties:
        contrasena:
          maxLength: 256
          title: Contrasena
          type: string
        correo:
          maxLength: 254
          title: Correo
          type: string
        nombre:
          maxLength: 200
          title: Nombre
          type: string
        proveedor_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Solo para el rol proveedor: el proveedor del catálogo al que pertenece la cuenta.'
          title: Proveedor Id
        rol:
          description: 'Obligatorio: no existe un rol por omisión (mínimo privilegio).'
          examples:
          - administrador
          - coordinador
          - proveedor
          title: Rol
          type: string
      required:
