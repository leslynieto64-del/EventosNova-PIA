          examples:
          - '800.00'
          title: Importe
      required:
      - concepto
      - importe
      - comunicado_en
      title: SolicitudPagoServicioAdicionalEntrada
      type: object
    SolicitudServicioAdicionalEntrada:
      additionalProperties: false
      properties:
        contrato_id:
          title: Contrato Id
