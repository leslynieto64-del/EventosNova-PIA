components:
  schemas:
    AceptarPropuestaEntrada:
      additionalProperties: false
      properties:
        version_id:
          examples:
          - PR-1a2b3c4d-v1
          title: Version Id
          type: string
      required:
      - version_id
      title: AceptarPropuestaEntrada
      type: object
    ActualizacionUsuarioEntrada:
      additionalProperties: false
      properties:
        correo:
          maxLength: 254
          title: Correo
          type: string
        nombre:
          maxLength: 200
          title: Nombre
          type: string
      required:
      - correo
      - nombre
      title: ActualizacionUsuarioEntrada
      type: object
    AlternativaEntrada:
      additionalProperties: false
      properties:
        condiciones_alternativa:
          examples:
          - Condiciones del reemplazo
          maxLength: 1000
          title: Condiciones Alternativa
          type: string
        costo_adicional:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Costo Adicional
        proveedor_id:
          description: 'D-P3: proveedor alternativo del catálogo (registrado, activo, que ofrece el servicio y distinto del
            original).'
          examples:
          - PV-1a2b3c4d
          maxLength: 100
          minLength: 1
          title: Proveedor Id
          type: string
      required:
      - proveedor_id
      - condiciones_alternativa
      title: AlternativaEntrada
      type: object
    AnexoEntrada:
      additionalProperties: false
      properties:
        descripcion:
          examples:
          - Cambio de hora
          title: Descripcion
          type: string
      required:
      - descripcion
      title: AnexoEntrada
      type: object
    AsignarProveedorEntrada:
      additionalProperties: false
      properties:
        proveedor_id:
          examples:
          - PV-1
          title: Proveedor Id
          type: string
      required:
      - proveedor_id
      title: AsignarProveedorEntrada
      type: object
    CambioContrasenaEntrada:
      additionalProperties: false
      properties:
        actual:
          maxLength: 256
          title: Actual
          type: string
        nueva:
          maxLength: 256
          title: Nueva
          type: string
      required:
      - actual
      - nueva
      title: CambioContrasenaEntrada
      type: object
    CancelacionEntrada:
      additionalProperties: false
      properties:
        motivo:
          examples:
          - El Cliente canceló
          title: Motivo
          type: string
      required:
      - motivo
      title: CancelacionEntrada
      type: object
    CancelacionFaltaRegularizacionEntrada:
      additionalProperties: false
      description: 'S-3. Con la autenticación activa el servidor ignora `coordinador` y `fecha`: registra la cuenta de la
        sesión y su propio reloj, para que

        nadie pueda atribuir la cancelación a otra persona ni fechar el registro a su conveniencia. Solo con la autenticación
        desactivada (pruebas

        y desarrollo local) se usan los valores enviados.'
      properties:
        coordinador:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Coordinador
          title: Coordinador
        fecha:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Fecha
        motivo:
          examples:
          - Saldo vencido sin regularizar
          title: Motivo
          type: string
      required:
      - motivo
      title: CancelacionFaltaRegularizacionEntrada
      type: object
    CierreNoAceptacionEntrada:
      additionalProperties: false
      properties:
        motivo:
          examples:
          - El Cliente no respondió
          title: Motivo
          type: string
      required:
      - motivo
      title: CierreNoAceptacionEntrada
      type: object
    ConceptoPago:
      enum:
      - Anticipo
      - SaldoContratoOriginal
      - SustitucionProveedor
      - Cambio
      - CargoCambioTardio
      - CargosMoratorios
      - ServicioAdicional
      title: ConceptoPago
      type: string
    ContrasenaEntrada:
      additionalProperties: false
      properties:
        contrasena:
          maxLength: 256
          title: Contrasena
          type: string
      required:
      - contrasena
      title: ContrasenaEntrada
      type: object
    CrearPropuestaEntrada:
      additionalProperties: false
      description: Campos de ContenidoPropuesta. La fecha de la versión la asigna el servidor.
      properties:
        condiciones:
          examples:
          - Condiciones generales
          title: Condiciones
          type: string
        costo_total:
          anyOf:
          - type: number
          - type: string
          examples:
          - '10000.00'
          title: Costo Total
        proveedores_considerados:
          examples:
          - - PV-1
          items:
            type: string
          title: Proveedores Considerados
          type: array
        servicios:
          examples:
          - - Banquete
          items:
            type: string
          title: Servicios
          type: array
      required:
      - servicios
      - proveedores_considerados
      - costo_total
      - condiciones
      title: CrearPropuestaEntrada
      type: object
    DatosEventoEntrada:
      additionalProperties: false
      description: Campos de DatosEvento. La fecha y hora se envían sin zona horaria, como las maneja el dominio.
      properties:
        fecha_hora:
          examples:
          - '2026-11-20T18:00:00'
          format: date-time
          title: Fecha Hora
          type: string
        invitados_aproximados:
          examples:
          - 100
          maximum: 9.223372036854776e+18
          title: Invitados Aproximados
          type: integer
        lugar:
          examples:
          - Salón
          title: Lugar
          type: string
        tipo:
          examples:
          - Boda
          title: Tipo
          type: string
      required:
      - tipo
      - fecha_hora
      - lugar
      - invitados_aproximados
      title: DatosEventoEntrada
      type: object
    DecisionEntrada:
      additionalProperties: false
      description: Decisión del Cliente o de Administración (`Decision`).
      properties:
        actor:
          examples:
          - Cliente
          title: Actor
          type: string
        aprobada:
          title: Aprobada
          type: boolean
        fecha:
          format: date-time
          title: Fecha
          type: string
        motivo:
          default: ''
          title: Motivo
          type: string
      required:
      - actor
      - aprobada
      - fecha
      title: DecisionEntrada
      type: object
    DecisionEsperaEntrada:
      additionalProperties: false
      properties:
        acepta_esperar:
          title: Acepta Esperar
          type: boolean
      required:
      - acepta_esperar
      title: DecisionEsperaEntrada
      type: object
    DevolucionEntrada:
      additionalProperties: false
      properties:
        comprobante:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          description: Comprobante de la devolución que Administración efectuó fuera del sistema (CA-098). Si se omite, se
            usa el ejecutor de devoluciones simulado.
          examples:
          - TRANSF-0001
          title: Comprobante
      title: DevolucionEntrada
      type: object
    DevolucionRespuesta:
      additionalProperties: false
      properties:
        comprobante:
          anyOf:
          - type: string
          - type: 'null'
          title: Comprobante
        concepto:
          title: Concepto
          type: string
        devolucionId:
          title: Devolucionid
          type: string
        enPlazo:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enplazo
        estado:
          title: Estado
          type: string
        fechaCierre:
          title: Fechacierre
          type: string
        fechaDevolucion:
          anyOf:
          - type: string
          - type: 'null'
          title: Fechadevolucion
        fechaLimite:
          title: Fechalimite
          type: string
        importe:
          title: Importe
          type: string
        pagoId:
          anyOf:
          - type: string
          - type: 'null'
          title: Pagoid
        solicitudId:
          anyOf:
          - type: string
          - type: 'null'
          title: Solicitudid
        tipo:
          title: Tipo
          type: string
      required:
      - devolucionId
      - concepto
      - importe
      - estado
      - fechaCierre
      - fechaLimite
      - tipo
      title: DevolucionRespuesta
      type: object
    DisponibilidadEntrada:
      additionalProperties: false
      description: 'D-P3: lo que el proveedor comunicó a Coordinación. Con `disponible` verdadero, `proveedor_id` (del catálogo:
        registrado, activo y que

        ofrece el servicio), `costo` (mayor que cero) y `condiciones` son obligatorios; con `disponible` falso no se envía
        nada más.'
      properties:
        condiciones:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          examples:
          - DJ 4 horas con equipo de sonido
          title: Condiciones
        costo:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          examples:
          - '800.00'
          title: Costo
        disponible:
          title: Disponible
          type: boolean
        proveedor_id:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          examples:
          - PV-1a2b3c4d
          title: Proveedor Id
      required:
      - disponible
      title: DisponibilidadEntrada
      type: object
    EstadoCuentaResumenRespuesta:
      additionalProperties: false
      properties:
        anticipo:
          $ref: '#/components/schemas/ObligacionPagoRespuesta'
        contratoId:
          title: Contratoid
          type: string
        devoluciones:
          items:
            $ref: '#/components/schemas/DevolucionRespuesta'
          title: Devoluciones
          type: array
        estadoCuentaId:
          title: Estadocuentaid
          type: string
        obligacionesAdicionales:
          items:
            $ref: '#/components/schemas/ObligacionAdicionalRespuesta'
          title: Obligacionesadicionales
          type: array
        pagosRegistrados:
          items:
            $ref: '#/components/schemas/PagoRegistradoRespuesta'
          title: Pagosregistrados
          type: array
        saldoContratoOriginal:
          $ref: '#/components/schemas/ObligacionPagoRespuesta'
      required:
      - estadoCuentaId
      - contratoId
      - anticipo
      - pagosRegistrados
      - saldoContratoOriginal
      - obligacionesAdicionales
      - devoluciones
      title: EstadoCuentaResumenRespuesta
      type: object
    EstadoPagosRespuesta:
      additionalProperties: false
      properties:
        estadosCuenta:
          items:
            $ref: '#/components/schemas/EstadoCuentaResumenRespuesta'
          title: Estadoscuenta
          type: array
        eventoId:
          title: Eventoid
          type: string
      required:
      - eventoId
      - estadosCuenta
      title: EstadoPagosRespuesta
      type: object
    EstadoUsuarioEntrada:
      additionalProperties: false
      properties:
        activo:
          title: Activo
          type: boolean
      required:
      - activo
      title: EstadoUsuarioEntrada
      type: object
    EventoRegistradoRespuesta:
      additionalProperties: false
      properties:
        evento_id:
          title: Evento Id
          type: string
        mensaje:
          title: Mensaje
          type: string
      required:
      - evento_id
      - mensaje
      title: EventoRegistradoRespuesta
      type: object
    FechaEntrada:
      additionalProperties: false
      description: Fecha y hora (sin zona) del hecho que se registra.
      properties:
        fecha:
          examples:
          - '2026-10-05T10:00:00'
          format: date-time
          title: Fecha
          type: string
      required:
      - fecha
      title: FechaEntrada
      type: object
    ImporteAdicionalSustitucionEntrada:
      additionalProperties: false
      properties:
        importe:
          anyOf:
          - type: number
          - type: string
          examples:
          - '250.75'
          title: Importe
      required:
      - importe
      title: ImporteAdicionalSustitucionEntrada
      type: object
    InicioSesionEntrada:
      additionalProperties: false
      properties:
        contrasena:
          maxLength: 256
          title: Contrasena
          type: string
        correo:
          examples:
          - coordinador@eventosnova.example
          maxLength: 254
          title: Correo
          type: string
      required:
      - correo
      - contrasena
      title: InicioSesionEntrada
      type: object
    ObligacionAdicionalRespuesta:
      additionalProperties: false
      properties:
        concepto:
          title: Concepto
          type: string
        estado:
          title: Estado
          type: string
        importe:
          title: Importe
          type: string
        obligacionId:
          anyOf:
          - type: string
          - type: 'null'
          title: Obligacionid
        origenId:
          anyOf:
          - type: string
          - type: 'null'
          title: Origenid
        pagado:
          anyOf:
          - type: string
          - type: 'null'
          title: Pagado
        plazo:
          anyOf:
          - type: string
          - type: 'null'
          title: Plazo
        registradoSinVerificar:
          anyOf:
          - type: string
          - type: 'null'
          title: Registradosinverificar
        saldo:
          anyOf:
          - type: string
          - type: 'null'
          title: Saldo
      required:
      - concepto
      - importe
      - estado
      title: ObligacionAdicionalRespuesta
      type: object
    ObligacionPagoRespuesta:
      additionalProperties: false
      description: 'Anticipo o saldo del contrato original. Vacío si el Estado de Cuenta no tiene esa obligación; `plazoVencido`
        solo se

        informa cuando la consulta recibe reloj (CA-023); `resultadoRegularizacion` solo aparece en el saldo ya revisado.'
      properties:
        estado:
          anyOf:
          - type: string
          - type: 'null'
          title: Estado
        fechaLimite:
          anyOf:
          - type: string
          - type: 'null'
          description: Vencimiento del plazo (ISO 8601); null si la obligación no tiene plazo
          title: Fechalimite
        importe:
          anyOf:
          - type: string
          - type: 'null'
          title: Importe
        obligacionId:
          anyOf:
          - type: string
          - type: 'null'
          title: Obligacionid
        pagado:
          anyOf:
          - type: string
          - type: 'null'
          description: Suma de los pagos Verificados de la obligación
          title: Pagado
        plazoVencido:
          anyOf:
          - type: boolean
          - type: 'null'
          description: true si la obligación sigue Pendiente o Vencida y su plazo ya venció a la hora de la consulta (CA-023)
          title: Plazovencido
        registradoSinVerificar:
          anyOf:
          - type: string
          - type: 'null'
          description: Pagos Registrados que aún no cuentan porque no están verificados
          title: Registradosinverificar
        resultadoRegularizacion:
          anyOf:
          - type: string
          - type: 'null'
          description: «Regularizado» o «No regularizado», registrado por Administración
          title: Resultadoregularizacion
        saldo:
          anyOf:
          - type: string
          - type: 'null'
          description: Importe menos lo pagado (nunca negativo)
          title: Saldo
      title: ObligacionPagoRespuesta
      type: object
    OperacionRespuesta:
      description: 'Éxito de una operación: mensaje del servicio y los datos que devuelve (identificadores, números...).'
      properties:
        datos:
          additionalProperties: true
          title: Datos
          type: object
        mensaje:
          title: Mensaje
          type: string
      required:
      - mensaje
      title: OperacionRespuesta
      type: object
    PagoEntrada:
      additionalProperties: false
      properties:
        comprobante:
          examples:
          - C-0001
          title: Comprobante
          type: string
        fecha:
          description: Cuándo el Cliente efectuó el pago (según el comprobante).
          examples:
          - '2026-10-05T10:00:00'
          format: date-time
          title: Fecha
          type: string
        importe:
          anyOf:
          - type: number
          - type: string
          examples:
          - '3000.00'
          title: Importe
        obligacion_id:
          examples:
          - OB-1a2b3c4d
          title: Obligacion Id
          type: string
        registrado_en:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Cuándo Administración lo registra; por omisión, la fecha del pago.
          title: Registrado En
        verificar_ahora:
          default: true
          description: Si es falso, el pago queda Registrado y se verifica después.
          title: Verificar Ahora
          type: boolean
      required:
      - obligacion_id
      - importe
      - fecha
      - comprobante
      title: PagoEntrada
      type: object
    PagoRegistradoRespuesta:
      additionalProperties: false
      properties:
        concepto:
          title: Concepto
          type: string
        estado:
          title: Estado
          type: string
        fecha:
          title: Fecha
          type: string
        importe:
          title: Importe
          type: string
        registradoEn:
          anyOf:
          - type: string
          - type: 'null'
          title: Registradoen
        verificadoEn:
          anyOf:
          - type: string
          - type: 'null'
          title: Verificadoen
      required:
      - concepto
      - importe
      - fecha
      - estado
      title: PagoRegistradoRespuesta
      type: object
    PrepararContratoEntrada:
      additionalProperties: false
      properties:
        politica_incluida:
          examples:
          - true
          title: Politica Incluida
          type: boolean
      required:
      - politica_incluida
      title: PrepararContratoEntrada
      type: object
    PropuestaCreadaRespuesta:
      additionalProperties: false
      properties:
        evento_id:
          title: Evento Id
          type: string
        mensaje:
          title: Mensaje
          type: string
        propuesta_id:
          title: Propuesta Id
          type: string
      required:
      - propuesta_id
      - evento_id
      - mensaje
      title: PropuestaCreadaRespuesta
      type: object
    ProtocoloCobroEntrada:
      additionalProperties: false
      properties:
        comunicado_en:
          format: date-time
          title: Comunicado En
          type: string
        importe_moratorio:
          anyOf:
          - type: number
          - type: string
          examples:
          - '200.00'
          title: Importe Moratorio
        seguimiento:
          examples:
          - Recordatorio amistoso
          title: Seguimiento
          type: string
      required:
      - importe_moratorio
      - comunicado_en
      - seguimiento
      title: ProtocoloCobroEntrada
      type: object
    ProveedorEntrada:
      additionalProperties: false
      description: 'Alta de un proveedor. Solo el nombre es obligatorio: el BRD no especifica más atributos.'
      properties:
        contacto:
          default: ''
          description: Texto libre (teléfono, correo...).
          examples:
          - 55 1234 5678
          maxLength: 300
          title: Contacto
          type: string
        nombre:
          examples:
          - Banquetes del Valle
          maxLength: 200
          title: Nombre
          type: string
        servicios:
          description: Servicios que ofrece; se usan para proponerlo al asignar un servicio contratado.
          examples:
          - - Banquete
            - Música
          items:
            maxLength: 100
            type: string
          maxItems: 30
          title: Servicios
          type: array
      required:
      - nombre
      title: ProveedorEntrada
      type: object
    RechazoRespuesta:
      additionalProperties: false
      description: 'Rechazo de negocio: el motivo es el que devuelve el servicio de aplicación o el dominio.'
      properties:
        detalle:
          title: Detalle
          type: string
        pendientes:
          default: []
          items:
            type: string
          title: Pendientes
          type: array
        tipo:
          default: rechazo_de_negocio
          title: Tipo
          type: string
      required:
      - detalle
      title: RechazoRespuesta
      type: object
    RegistrarEventoEntrada:
      additionalProperties: false
      description: Parámetros de GestionPropuestaService.registrar_evento.
      properties:
        cliente_id:
          examples:
          - CL-1
          title: Cliente Id
          type: string
        datos:
          $ref: '#/components/schemas/DatosEventoEntrada'
        servicios:
          examples:
          - - Banquete
          items:
            type: string
          title: Servicios
          type: array
      required:
      - cliente_id
      - datos
      - servicios
      title: RegistrarEventoEntrada
      type: object
    RegularizacionEntrada:
      additionalProperties: false
      properties:
        revisado_en:
          format: date-time
          title: Revisado En
          type: string
      required:
      - revisado_en
      title: RegularizacionEntrada
      type: object
    RespuestaProveedorEntrada:
      additionalProperties: false
      description: 'El proveedor responde desde su cuenta (sin `medio`). Coordinación registra lo que el proveedor le comunicó
        e INDICA el medio (S-5).

        El origen de la respuesta y la cuenta que la registra los decide el servidor a partir de la sesión, nunca este cuerpo.'
      properties:
        disponible:
          title: Disponible
          type: boolean
        medio:
          anyOf:
          - enum:
            - Llamada telefónica
            - Mensaje (WhatsApp o SMS)
            - Correo electrónico
            - Otro
            type: string
          - type: 'null'
          description: 'Solo Coordinación: medio por el que el proveedor comunicó su respuesta.'
          title: Medio
        proveedor_id:
          examples:
          - PV-1
          title: Proveedor Id
          type: string
      required:
      - proveedor_id
      - disponible
      title: RespuestaProveedorEntrada
      type: object
    RevisionAdministrativaEntrada:
      additionalProperties: false
      properties:
        fecha:
          format: date-time
          title: Fecha
          type: string
        resultado:
          examples:
          - Sin reembolso (política de no reembolso)
          title: Resultado
          type: string
      required:
      - resultado
      - fecha
      title: RevisionAdministrativaEntrada
      type: object
    SeguimientoAnticipoEntrada:
      additionalProperties: false
      properties:
        fecha:
          examples:
          - '2026-10-09T10:00:00'
          format: date-time
          title: Fecha
          type: string
        resultado_contacto:
          examples:
          - Se contactó al Cliente
          title: Resultado Contacto
          type: string
        sin_pago_tras_seguimiento:
          examples:
          - false
          title: Sin Pago Tras Seguimiento
          type: boolean
      required:
      - fecha
      - resultado_contacto
      - sin_pago_tras_seguimiento
      title: SeguimientoAnticipoEntrada
      type: object
    SolicitudCambioEntrada:
      additionalProperties: false
      properties:
        condiciones_propuestas:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          description: servicioContratadoId → descripción de las nuevas condiciones.
          title: Condiciones Propuestas
        contrato_id:
          title: Contrato Id
          type: string
        datos_propuestos:
          anyOf:
          - $ref: '#/components/schemas/DatosEventoEntrada'
          - type: 'null'
        descripcion:
          examples:
          - Cambiar la hora
          title: Descripcion
          type: string
        evento_id:
          title: Evento Id
          type: string
        tarifa_vigente:
          anyOf:
          - type: number
          - type: string
          description: Tarifa vigente del cargo por cambio tardío (BN-003).
          examples:
          - '500.00'
          title: Tarifa Vigente
      required:
      - evento_id
