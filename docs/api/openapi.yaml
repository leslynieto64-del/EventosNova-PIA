          title: Evento Id
          type: string
        servicio:
          examples:
          - Foto
          title: Servicio
          type: string
      required:
      - evento_id
      - contrato_id
      - servicio
      title: SolicitudServicioAdicionalEntrada
      type: object
    SustitucionEntrada:
